<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Smart e-Print</title>
  <meta name="description" content="Register a Smart e-Print account to start managing your print orders." />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <!-- Animated Background -->
  <div class="bg-animated">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <!-- ── Auth Card ─────────────────────────────────────────────────────────── -->
  <div class="auth-page-wrap">
    <div class="glass-card auth-card" style="max-width:500px;">

      <!-- Logo -->
      <div class="auth-logo">
        <a href="index.html" style="text-decoration:none;">
          <div class="brand-name gradient-text">Smart e-Print</div>
          <div class="brand-sub">Umiya Graphics &amp; Printing</div>
        </a>
      </div>

      <h1 class="auth-heading">Create your account</h1>
      <p class="auth-subheading">Join Smart e-Print to start managing print orders</p>

      <!-- Error Alert -->
      <div id="formAlert" class="form-alert" role="alert"></div>

      <!-- ── Register Form ───────────────────────────────────────────────── -->
      <form id="registerForm" novalidate autocomplete="on">

        <!-- Role Selector -->
        <div style="margin-bottom:20px;">
          <span class="role-section-label">I am a…</span>
          <div class="role-selector" id="roleSelector">

            <div class="role-card selected" id="cardCustomer" data-role="customer"
                 onclick="selectRole('customer')" tabindex="0"
                 onkeydown="if(event.key==='Enter')selectRole('customer')">
              <span class="role-check">✓</span>
              <span class="role-icon">🛒</span>
              <div class="role-name">Customer</div>
              <div class="role-desc">Upload docs &amp; track orders</div>
            </div>

            <div class="role-card" id="cardOwner" data-role="owner"
                 onclick="selectRole('owner')" tabindex="0"
                 onkeydown="if(event.key==='Enter')selectRole('owner')">
              <span class="role-check">✓</span>
              <span class="role-icon">🏪</span>
              <div class="role-name">Shop Owner</div>
              <div class="role-desc">Manage orders &amp; analytics</div>
            </div>

          </div>
          <!-- Hidden input carries the selected role -->
          <input type="hidden" id="selectedRole" value="customer" />
        </div>

        <!-- Full Name -->
        <div class="form-floating-custom">
          <input type="text" id="regName" placeholder="name" autocomplete="name" required />
          <label for="regName"><i class="bi bi-person me-1"></i>Full name</label>
        </div>

        <!-- Email -->
        <div class="form-floating-custom">
          <input type="email" id="regEmail" placeholder="email" autocomplete="email" required />
          <label for="regEmail"><i class="bi bi-envelope me-1"></i>Email address</label>
        </div>

        <!-- Password -->
        <div class="form-floating-custom password-wrapper">
          <input
            type="password"
            id="regPassword"
            placeholder="password"
            autocomplete="new-password"
            required
          />
          <label for="regPassword"><i class="bi bi-lock me-1"></i>Password (min. 6 characters)</label>
          <button type="button" class="password-toggle" id="pwToggle" aria-label="Show/hide password">
            <i class="bi bi-eye" id="pwToggleIcon"></i>
          </button>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-gradient w-100 mt-2" id="registerBtn"
                style="height:50px;position:relative;">
          <i class="bi bi-person-plus me-1"></i> Create Account
        </button>

      </form>

      <div class="auth-divider">or</div>

      <p class="auth-link-text">
        Already have an account? <a href="login.html" id="goLoginLink">Sign in</a>
      </p>

    </div>
  </div><!-- /.auth-page-wrap -->

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Already logged in? Skip this page.
    redirectIfLoggedIn();

    // Password toggle
    initPasswordToggle('regPassword', 'pwToggle', 'pwToggleIcon');

    // ── Role Selection ──────────────────────────────────────────────────────
    function selectRole(role) {
      document.getElementById('selectedRole').value = role;
      document.getElementById('cardCustomer').classList.toggle('selected', role === 'customer');
      document.getElementById('cardOwner').classList.toggle('selected',   role === 'owner');
    }

    // ── Form Submit ─────────────────────────────────────────────────────────
    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      hideFormAlert('formAlert');

      const name     = document.getElementById('regName').value.trim();
      const email    = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const role     = document.getElementById('selectedRole').value;
      const btn      = document.getElementById('registerBtn');

      // Client-side validation
      if (!name || !email || !password) {
        showFormError('formAlert', '⚠  Please fill in all fields.');
        return;
      }
      if (password.length < 6) {
        showFormError('formAlert', '⚠  Password must be at least 6 characters.');
        return;
      }
      const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRe.test(email)) {
        showFormError('formAlert', '⚠  Please enter a valid email address.');
        return;
      }

      setLoading(btn, true);
      const { ok, data } = await registerUser(name, email, password, role);
      setLoading(btn, false);

      if (ok) {
        setToken(data.token);
        setStoredUser(data.user);
        showToast('Account created! Welcome, ' + data.user.name + '! 🎉');
        setTimeout(() => redirectByRole(data.user.role), 800);
      } else {
        showFormError('formAlert', '✕  ' + (data.error || 'Registration failed. Please try again.'));
      }
    });
  </script>
</body>
</html>
