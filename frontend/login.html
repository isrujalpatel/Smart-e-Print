<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Smart e-Print</title>
  <meta name="description" content="Sign in to Smart e-Print to manage your print orders." />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- Animated Background -->
  <div class="bg-animated">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <!-- ── Auth Card ─────────────────────────────────────────────────────────── -->
  <div class="auth-page-wrap">
    <div class="glass-card auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <a href="index.html" style="text-decoration:none;">
          <div class="brand-name gradient-text">Smart e-Print</div>
          <div class="brand-sub">Umiya Graphics &amp; Printing</div>
        </a>
      </div>

      <h1 class="auth-heading">Welcome back 👋</h1>
      <p class="auth-subheading">Sign in to your account to continue</p>

      <!-- Error Alert -->
      <div id="formAlert" class="form-alert" role="alert"></div>

      <!-- ── Login Form ──────────────────────────────────────────────────── -->
      <form id="loginForm" novalidate autocomplete="on">

        <!-- Email -->
        <div class="form-floating-custom">
          <input
            type="email"
            id="loginEmail"
            placeholder="email"
            autocomplete="email"
            required
          />
          <label for="loginEmail"><i class="bi bi-envelope me-1"></i>Email address</label>
        </div>

        <!-- Password -->
        <div class="form-floating-custom password-wrapper">
          <input
            type="password"
            id="loginPassword"
            placeholder="password"
            autocomplete="current-password"
            required
          />
          <label for="loginPassword"><i class="bi bi-lock me-1"></i>Password</label>
          <button type="button" class="password-toggle" id="pwToggle" aria-label="Show/hide password">
            <i class="bi bi-eye" id="pwToggleIcon"></i>
          </button>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-gradient w-100 mt-2" id="loginBtn"
                style="height:50px;position:relative;">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>

      </form>

      <!-- ── Google Sign-In ──────────────────────────────────────────────── -->
      <div class="auth-divider">or continue with</div>

      <button type="button" class="btn-google" id="googleLoginBtn">
        <!-- Google 'G' logo SVG -->
        <svg class="google-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign in with Google
      </button>

      <p class="auth-link-text" style="margin-top:20px;">
        Don't have an account? <a href="register.html" id="goRegisterLink">Create one</a>
      </p>

    </div>
  </div><!-- /.auth-page-wrap -->

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Already logged in? Skip this page.
    redirectIfLoggedIn();

    // Password toggle
    initPasswordToggle('loginPassword', 'pwToggle', 'pwToggleIcon');

    // ── Form submit ─────────────────────────────────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      hideFormAlert('formAlert');

      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn      = document.getElementById('loginBtn');

      if (!email || !password) {
        showFormError('formAlert', '⚠  Please fill in all fields.');
        return;
      }

      setLoading(btn, true);
      const { ok, data } = await loginUser(email, password);
      setLoading(btn, false);

      if (ok) {
        setToken(data.token);
        setStoredUser(data.user);
        showToast('Welcome back, ' + data.user.name + '! 🎉');
        setTimeout(() => redirectByRole(data.user.role), 800);
      } else {
        showFormError('formAlert', '✕  ' + (data.error || 'Login failed. Please try again.'));
      }
    });

    // ── Google Sign-In ───────────────────────────────────────────────────────
    const GOOGLE_CLIENT_ID = '424686117630-cblseu5hg9mhhfg03mv1eeg4g51rqa2u.apps.googleusercontent.com';

    // Called by GIS with the credential (ID token)
    async function handleGoogleCredential(response) {
      const btn = document.getElementById('googleLoginBtn');
      hideFormAlert('formAlert');
      setLoading(btn, true);

      const { ok, data } = await googleAuthUser(response.credential, 'customer');
      setLoading(btn, false);

      if (ok) {
        setToken(data.token);
        setStoredUser(data.user);
        showToast('Welcome, ' + data.user.name + '! 🎉');
        setTimeout(() => redirectByRole(data.user.role), 800);
      } else {
        showFormError('formAlert', '✕  ' + (data.error || 'Google sign-in failed. Please try again.'));
      }
    }

    // Initialize GIS once the library loads
    function initGoogleSignIn() {
      if (typeof google === 'undefined') return;
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCredential,
        auto_select: false,
        cancel_on_tap_outside: true,
      });
    }

    // Trigger One Tap / popup on button click
    document.getElementById('googleLoginBtn').addEventListener('click', function () {
      if (typeof google === 'undefined') {
        showFormError('formAlert', '⚠  Google Sign-In not loaded yet. Please try again.');
        return;
      }
      initGoogleSignIn();
      google.accounts.id.prompt(function (notification) {
        // If One Tap is suppressed (browser policy), fall back to popup
        if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
          const popup = window.open(
            `https://accounts.google.com/o/oauth2/v2/auth?` +
            `client_id=${encodeURIComponent(GOOGLE_CLIENT_ID)}` +
            `&redirect_uri=${encodeURIComponent(window.location.origin + '/auth/google/callback')}` +
            `&response_type=token&scope=openid%20email%20profile`,
            'googleSignIn', 'width=500,height=600'
          );
        }
      });
    });

    // Initialize after GIS library loads
    window.addEventListener('load', initGoogleSignIn);
  </script>
</body>
</html>
